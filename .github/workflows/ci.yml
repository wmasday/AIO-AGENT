name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Every adapter except Claude Code, which is configured through its own CLI.
  ADAPTERS: codex,cursor,antigravity,kimi,pi,omp,agents-md

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Offline: relative links only. External sites are checked by hand before a release.
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-skills.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Round-trip tests
        run: node --test tests/roundtrip.test.mjs
      - name: Install, doctor, uninstall (bash)
        if: runner.os != 'Windows'
        run: |
          scripts/install.sh --only "$ADAPTERS"
          scripts/install.sh --only "$ADAPTERS"
          scripts/doctor.sh --only "$ADAPTERS"
          scripts/uninstall.sh
          test ! -e "$HOME/.aio-agent"
      - name: Install, doctor, uninstall (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 --only $env:ADAPTERS
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/install.ps1 --only $env:ADAPTERS
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/doctor.ps1 --only $env:ADAPTERS
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/uninstall.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $HOME '.aio-agent')) { exit 1 }
