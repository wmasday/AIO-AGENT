# Agents that read ~/.agents/skills; also writes OpenCode's global AGENTS.md.
# OpenCode: https://opencode.ai/docs/rules, https://opencode.ai/docs/skills
NAME=OpenCode and other AGENTS.md agents
DETECT_COMMANDS=opencode
BASE=~/.config/opencode
SKILLS_DIR=~/.agents/skills
RULES_MODE=block
RULES_PATH={BASE}/AGENTS.md
MCP_MODE=none
