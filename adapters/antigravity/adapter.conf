# Google Antigravity: https://antigravity.google/docs/rules, /skills, /mcp
NAME=Google Antigravity
DETECT_COMMANDS=agy
DETECT_DIRS=~/.gemini/antigravity ~/.gemini/antigravity-cli ~/.gemini/antigravity-ide
BASE=~/.gemini/config
SKILLS_DIR={BASE}/skills
RULES_MODE=file
RULES_PATH={BASE}/rules/aio-agent.md
RULES_FRONTMATTER=trigger: always_on\ndescription: AIO-AGENT router, which loads AIO-AGENT skills when their triggers match
MCP_MODE=json
MCP_PATH={BASE}/mcp_config.json
MCP_URL_KEY=serverUrl
MCP_ENV_STYLE=none
